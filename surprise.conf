#!/bin/bash

# ############################################ #
#  EU149FIO "Surprise" Feature System - config  #
# ############################################ #
# Everything below belongs ONLY to the surprise system:
#   scripts/feature_runner.sh + scripts/features/*
# It is fully separate from config.conf (the frame-posting engine).

# --- Page / API ---

# The Facebook Page ID surprise features post to.
# (This used to be hardcoded inside the old scripts/reshare_random.sh;
#  it now lives here so every feature shares one source of truth.)
SURPRISE_PAGE_ID="222489564281150"

# Graph API version used by surprise features.
# (Kept separate from FRMENV_FBAPI_VER so the two systems move independently.)
SURPRISE_FBAPI_VER="v23.0"

# --- Runner ---

# The registry the runner picks a feature from on every run:
SURPRISE_REGISTRY="scripts/features/registry.conf"

# 1 = try not to run the same feature twice in a row (one reroll).
RUNNER_AVOID_REPEAT="1"

# Directory where every feature keeps its logs/state.
# This directory is committed back to the repo by CI after every run.
SURPRISE_STATE_DIR="fb/surprise"

# --- booru_guess feature ---

# WD14 tagger model (Hugging Face repo id). Downloaded once, then cached by CI.
# Lighter alternatives if the runner is too slow for you:
#   SmilingWolf/wd-vit-tagger-v3       (~380 MB)
#   SmilingWolf/wd-swinv2-tagger-v3    (~470 MB)
# NOTE: if you change this, also update the cache key
# ("wd14-eva02-large-tagger-v3") in .github/workflows/surprise.yml.
BG_MODEL_REPO="SmilingWolf/wd-eva02-large-tagger-v3"

# Local dir for the model files. This lives OUTSIDE the repo (in your home
# cache) on purpose: the model is ~1.2 GB and GitHub rejects any file over
# 100 MB, so it must never be committed. CI caches it via actions/cache;
# locally it is simply reusable across runs. Safe to delete any time.
BG_MODEL_DIR="${HOME}/.cache/wd14-model"

# Confidence threshold for character tags.
# WD14 scores hover around ~0.50 for "maybe" characters (noise floor), so
# 0.55 keeps only fairly confident detections and keeps captions free of
# members who aren't really in the frame. Lower it (e.g. 0.35) for wider
# coverage if captions feel too sparse.
BG_CHAR_THRESH="0.55"
BG_GEN_THRESH="0.35"

# Candidate rerolls per run. A candidate is skipped when its image can't be
# fetched or the tagger finds no U149 roster character in it.
BG_MAX_ATTEMPTS="5"

# Caption of a booru_guess post = detected names only ("no further say").
# This is the separator placed between the names. Default: one name per line.
BG_CAPTION_SEPARATOR=$'\n'

# Dry-run sample image (used only when FRMENV_DRY_RUN=1, i.e. testing the
# whole pipeline WITHOUT a Facebook token): the tagger runs on this repo
# file instead of a downloaded post. frame_500 reliably contains several
# U149 members, so the dry-run prints a real caption.
BG_DRYRUN_SAMPLE="frames/frame_500.jpg"
