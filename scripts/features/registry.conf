# ############################################ #
#  Surprise feature registry                    #
# ############################################ #
# The feature runner (scripts/feature_runner.sh) picks ONE enabled feature
# at random (weighted) on every scheduled run and executes it.
#
# Format (pipe-separated, one feature per line):
#
#   feature_id|enabled|weight|description
#
#   feature_id : exact filename of the feature script, without ".sh"
#                (e.g. "booru_guess" -> scripts/features/booru_guess.sh)
#   enabled    : 1 = eligible for picking, 0 = skipped
#   weight     : positive integer; weight 2 = picked twice as often as
#                weight 1. Keep it 1 for a uniform lottery.
#   description: free text (for humans, ignored by the runner)
#
# Adding a new feature later = drop a scripts/features/<id>.sh file in this
# directory and add one line below. Nothing else needs to change.
booru_guess|1|1|Download a random past frame, detect the U149 cast with a WD14 booru tagger, caption their names
random_reshare|1|1|Reshare a random old frame post from the page's posting history
