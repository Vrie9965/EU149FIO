# ############################################ #
#  booru_guess — U149 cast map                  #
# ############################################ #
# Maps WD14/danbooru character tags -> the caption name that gets posted.
# Only names listed here survive the filter; everything else the tagger
# detects (guest idols, crossovers, background characters) is dropped.
#
# Format (pipe-separated):
#   danbooru_tag|caption name
#
# Tag strings were verified against the model vocabulary
# (selected_tags.csv of SmilingWolf/wd-eva02-large-tagger-v3).
# Caption format: lowercase, given name first ("momoka sakurai").
#
# The current U149 core cast (9 idols + Producer), per the anime's
# official character list:

tachibana_arisu|arisu tachibana
sakurai_momoka|momoka sakurai
akagi_miria|miria akagi
matoba_risa|risa matoba
yuuki_haru|haru yuuki
sasaki_chie|chie sasaki
ryuzaki_kaoru|kaoru ryuzaki
ichihara_nina|nina ichihara
koga_koharu|koharu koga
# NOTE: koga_koharu exists on danbooru but is NOT in the current WD14
# vocabulary, so the model cannot emit it yet. Kept here so the roster is
# complete — it simply never matches until the vocabulary catches up.

# --- Producer (he fires under several tags; the feature deduplicates) ---
p-head_producer|producer
producer_(idolmaster)|producer
producer_(idolmaster_cinderella_girls_anime)|producer

